name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Sur main, jamais d'annulation : un déploiement ne doit pas être coupé en route.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node_modules est mis en cache (clé = package-lock.json) pour les jobs suivants
      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  format:
    name: Format (Prettier)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run format:check

  lint:
    name: Lint (ESLint)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test:
    name: Tests (Vitest)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Tests + couverture
        run: npm run test:coverage
      # Tableau dans le résumé du run + badge SVG (publié par coverage-badges)
      - name: Rapport de couverture
        run: >-
          node scripts/coverage-report.mjs --summary coverage/coverage-summary.json
          --name front --label "front (logique TS)" --out coverage-badge
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-front-html
          path: coverage
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badge-front
          path: coverage-badge
          retention-days: 7

  build:
    name: Build
    needs: [format, lint, typecheck, test, i18n]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build

  # ---------- Langues : chaque *.json comparé à en.json (front et API) ----------

  i18n:
    name: i18n (clés des locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Script sans dépendance : pas besoin de npm ci
      - run: npm run i18n:check

  # ---------- API Hono (api/) ----------

  api-install:
    name: API · Install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      # api/node_modules est mis en cache (clé = api/package-lock.json) pour les jobs suivants
      - name: Cache api/node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: api/node_modules
          key: api-node-modules-${{ runner.os }}-node24-${{ hashFiles('api/package-lock.json') }}

      - name: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  api-format:
    name: API · Format (Prettier)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run format:check

  api-lint:
    name: API · Lint (ESLint)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run lint

  api-typecheck:
    name: API · Typecheck
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run typecheck

  api-test:
    name: API · Tests (Vitest)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm test

  # Routes de l'API sur un vrai Postgres (schéma = supabase/migrations, appliquées par le runner), sans mock SQL
  api-test-db:
    name: API · Tests BDD + couverture
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wishlist_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wishlist_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      # Tests unitaires ET tests sur Postgres, en un seul calcul de couverture
      - name: Tests + couverture
        run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54329/wishlist_test
      - name: Rapport de couverture
        run: >-
          node ../scripts/coverage-report.mjs --summary coverage/coverage-summary.json
          --name api --label API --out coverage-badge
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-api-html
          path: api/coverage
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badge-api
          path: api/coverage-badge
          retention-days: 7

  api-health:
    name: API · Build + /health
    needs: [api-format, api-lint, api-typecheck, api-test, api-test-db, i18n]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run build

      - name: Démarrer l'API
        run: npm start > api.log 2>&1 &
        env:
          PORT: 3001
          GIT_SHA: ${{ github.sha }}

      - name: GET /health doit répondre 200
        run: |
          code=$(curl -s -o health.json -w '%{http_code}' \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://localhost:3001/health)
          echo "GET /health → HTTP $code"
          cat health.json; echo
          test "$code" = 200
          jq -e \
            --arg version "$(node -p "require('./package.json').version")" \
            --arg commit "${GITHUB_SHA::7}" \
            '.status == "ok" and .version == $version and .commit == $commit' \
            health.json

      - name: Logs de l'API
        if: always()
        run: cat api.log

  # ---------- Infra AWS (infra/) : Lambda + API Gateway, sans identifiants ----------

  infra-synth:
    name: Infra · CDK synth
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Construit le paquet Lambda puis génère le template CloudFormation
      - run: npm run synth

  # ---------- Parcours réel : Nuxt + API Hono ----------

  e2e:
    name: E2E (Playwright)
    needs: [build, api-health]
    runs-on: ubuntu-latest
    # L'API de l'E2E écrit dans une vraie base (migrations appliquées au démarrage).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wishlist_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wishlist_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54329/wishlist_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-api

      - name: Build Nuxt
        run: npm run build

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # Playwright démarre lui-même l'API (:3201) et Nuxt (:3200)
      - name: Parcours wishlist
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # ---------- Déploiement du front (Vercel), après réussite de toute la CI ----------

  deploy:
    name: Deploy (Vercel)
    needs: [build, e2e, i18n, infra-synth]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@65.10.0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Configuration Vercel (production)
        run: npx -y "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Nuxt compilé en SSR (preset vercel) dans la CI ; GITHUB_SHA -> /api/health
      - name: Build
        run: npx -y "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
        env:
          # Sans ça, Nitro détecte GitHub Actions et compile pour un serveur Node.
          NITRO_PRESET: vercel
          # Pas de fiches générées au build ici (PRERENDER_POKEMON) : le plan
          # gratuit de Vercel limite l'envoi à 5 000 fichiers par 24 h et les
          # 1 025 fiches en font ~2 050 par déploiement. Sur Vercel, les fiches
          # sont rendues à la demande (SSR) ; la version générée au build est
          # servie par CloudFront (job deploy-static).

      - name: Taille de l'envoi
        run: echo "$(find .vercel/output -type f | wc -l) fichiers à envoyer"

      - name: Déploiement
        run: npx -y "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Le site en ligne sert ce commit
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          expected="${GITHUB_SHA::7}"
          for i in $(seq 1 20); do
            # Juste après le déploiement, la réponse peut ne pas encore être du JSON :
            # on réessaie au lieu d'échouer.
            commit=$(curl -s "$PRODUCTION_URL/api/health" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "essai $i : en ligne = ${commit:-?}, attendu = $expected"
            [ "$commit" = "$expected" ] && break
            [ "$i" = 20 ] && exit 1
            sleep 3
          done

  # ---------- Site statique (nuxt generate) : S3 + CloudFront, après toute la CI ----------

  deploy-static:
    name: Deploy statique (S3 + CloudFront)
    needs: [build, e2e, i18n, infra-synth]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Le rôle AWS n'accepte que cet environnement de ce dépôt (OIDC).
    environment:
      name: static
      url: ${{ vars.STATIC_URL }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-static
      cancel-in-progress: false
    env:
      STATIC_URL: ${{ vars.STATIC_URL }}
      STATIC_BUCKET: ${{ vars.STATIC_BUCKET }}
      STATIC_DISTRIBUTION_ID: ${{ vars.STATIC_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # generate : accueil + 1 025 fiches + version.json, sans serveur
      - name: Generate
        run: npx nuxt generate
        env:
          NUXT_PUBLIC_STATIC_SITE: '1'
          PRERENDER_POKEMON: '1'
          NUXT_PUBLIC_API_BASE: ${{ vars.API_URL }}

      - name: Pages générées (avant l'envoi)
        working-directory: .output/public
        run: |
          count=$(find pokemon -name index.html | wc -l)
          echo "$count fiches HTML générées"
          test "$count" -ge 1025
          test -f index.html && test -f 404.html
          grep -q 'Statik' pokemon/pikachu/index.html
          jq -e --arg c "${GITHUB_SHA::7}" '.commit == $c' version.json

      # Gardé 30 jours : un retour en arrière (rollback.yml) remet exactement
      # ces fichiers en ligne, sans rien régénérer.
      - name: Conserver le site généré
        uses: actions/upload-artifact@v4
        with:
          name: site-statique-${{ github.sha }}
          path: .output/public
          retention-days: 30
          if-no-files-found: error

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      # sync S3 : _nuxt/ (noms uniques par build) gardés 1 an, jamais supprimés
      # (un visiteur sur l'ancienne version peut encore en avoir besoin) ;
      # le reste (HTML, JSON) revalidé à chaque visite, et supprimé s'il a disparu.
      - name: Sync S3
        run: |
          aws s3 sync .output/public/_nuxt "s3://$STATIC_BUCKET/_nuxt" \
            --cache-control "public,max-age=31536000,immutable" --only-show-errors
          aws s3 sync .output/public "s3://$STATIC_BUCKET" --exclude "_nuxt/*" --delete \
            --cache-control "public,max-age=0,must-revalidate" --only-show-errors
          echo "$(aws s3 ls "s3://$STATIC_BUCKET" --recursive | wc -l) fichiers dans le bucket"

      - name: Invalidation CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$STATIC_DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)
          echo "invalidation $id"
          aws cloudfront wait invalidation-completed --distribution-id "$STATIC_DISTRIBUTION_ID" --id "$id"

      - name: Le site statique en ligne sert ce commit
        run: |
          expected="${GITHUB_SHA::7}"
          commit=$(curl -s "$STATIC_URL/version.json" | jq -r '.commit // empty' 2>/dev/null || true)
          echo "en ligne = ${commit:-?}, attendu = $expected"
          test "$commit" = "$expected"

  # ---------- Contrôle de toute la production, après les deux déploiements ----------

  check-production:
    name: Contrôle de la production
    needs: [deploy, deploy-static]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check-production.yml
    with:
      expected_commit: ${{ github.sha }}

  # ---------- Badges et rapport de couverture (branche « badges ») ----------

  coverage-badges:
    name: Couverture (badges)
    needs: [test, api-test-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badges
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-badge-*
          path: badges
          merge-multiple: true

      # Branche dédiée (pas main) : ni commit parasite sur main, ni CI relancée.
      - name: Publier sur la branche badges
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          site=$(mktemp -d)
          git -C "$site" init -q
          git -C "$site" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$site" fetch -q --depth 1 origin badges; then
            git -C "$site" checkout -q -b badges FETCH_HEAD
          else
            git -C "$site" checkout -q --orphan badges
          fi

          cp badges/coverage-front.svg badges/coverage-api.svg "$site/"
          {
            echo "# Couverture des tests"
            echo
            echo "Dernier rapport de \`main\` : commit [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}), $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo "Rapports HTML complets (fichier par fichier, ligne par ligne) : artefacts \`coverage-front-html\` et \`coverage-api-html\` du [run]($RUN_URL)."
            echo
            echo "![coverage front](coverage-front.svg) ![coverage API](coverage-api.svg)"
            echo
            cat badges/coverage-front.md
            echo
            cat badges/coverage-api.md
            echo
            echo "_Front : logique TypeScript testée par Vitest (app/utils, shared/utils, server/lib, build, scripts) ; les composants .vue, composables et routes Nuxt sont couverts par les tests E2E Playwright. API : tests unitaires + tests sur Postgres réunis._"
          } > "$site/README.md"

          cd "$site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Couverture inchangée."
          else
            git commit -q -m "coverage: ${GITHUB_SHA::7}"
            git push -q origin badges
            echo "Badges et rapport publiés pour ${GITHUB_SHA::7}."
          fi
