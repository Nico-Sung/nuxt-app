name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node_modules est mis en cache (clé = package-lock.json) pour les jobs suivants
      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  format:
    name: Format (Prettier)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run format:check

  lint:
    name: Lint (ESLint)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test:
    name: Tests (Vitest)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm test

  build:
    name: Build
    needs: [format, lint, typecheck, test, i18n]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build

  # ---------- Langues : chaque *.json comparé à en.json (front et API) ----------

  i18n:
    name: i18n (clés des locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Script sans dépendance : pas besoin de npm ci
      - run: npm run i18n:check

  # ---------- API Hono (api/) ----------

  api-install:
    name: API · Install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      # api/node_modules est mis en cache (clé = api/package-lock.json) pour les jobs suivants
      - name: Cache api/node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: api/node_modules
          key: api-node-modules-${{ runner.os }}-node24-${{ hashFiles('api/package-lock.json') }}

      - name: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  api-format:
    name: API · Format (Prettier)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run format:check

  api-lint:
    name: API · Lint (ESLint)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run lint

  api-typecheck:
    name: API · Typecheck
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run typecheck

  api-test:
    name: API · Tests (Vitest)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm test

  # Routes de l'API sur un vrai Postgres (schéma supabase/init.sql), sans mock SQL
  api-test-db:
    name: API · Tests BDD (Postgres)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wishlist_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wishlist_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54329/wishlist_test

  api-health:
    name: API · Build + /health
    needs: [api-format, api-lint, api-typecheck, api-test, api-test-db, i18n]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run build

      - name: Démarrer l'API
        run: npm start > api.log 2>&1 &
        env:
          PORT: 3001
          GIT_SHA: ${{ github.sha }}

      - name: GET /health doit répondre 200
        run: |
          code=$(curl -s -o health.json -w '%{http_code}' \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://localhost:3001/health)
          echo "GET /health → HTTP $code"
          cat health.json; echo
          test "$code" = 200
          jq -e \
            --arg version "$(node -p "require('./package.json').version")" \
            --arg commit "${GITHUB_SHA::7}" \
            '.status == "ok" and .version == $version and .commit == $commit' \
            health.json

      - name: Logs de l'API
        if: always()
        run: cat api.log

  # ---------- Parcours réel : Nuxt + API Hono ----------

  e2e:
    name: E2E (Playwright)
    needs: [build, api-health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-api

      - name: Build Nuxt
        run: npm run build

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # Playwright démarre lui-même l'API (:3201) et Nuxt (:3200)
      - name: Parcours wishlist
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
