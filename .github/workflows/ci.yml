name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node_modules est mis en cache (clé = package-lock.json) pour les jobs suivants
      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  format:
    name: Format (Prettier)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run format:check

  lint:
    name: Lint (ESLint)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test:
    name: Tests (Vitest)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm test

  build:
    name: Build
    needs: [format, lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build

  # ---------- API Hono (api/) ----------

  api-install:
    name: API · Install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      # api/node_modules est mis en cache (clé = api/package-lock.json) pour les jobs suivants
      - name: Cache api/node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: api/node_modules
          key: api-node-modules-${{ runner.os }}-node24-${{ hashFiles('api/package-lock.json') }}

      - name: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  api-format:
    name: API · Format (Prettier)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run format:check

  api-lint:
    name: API · Lint (ESLint)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run lint

  api-typecheck:
    name: API · Typecheck
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run typecheck

  api-test:
    name: API · Tests (Vitest)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm test

  api-health:
    name: API · Build + /health
    needs: [api-format, api-lint, api-typecheck, api-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - run: npm run build

      - name: Démarrer l'API
        run: npm start > api.log 2>&1 &
        env:
          PORT: 3001
          GIT_SHA: ${{ github.sha }}

      - name: GET /health doit répondre 200
        run: |
          code=$(curl -s -o health.json -w '%{http_code}' \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://localhost:3001/health)
          echo "GET /health → HTTP $code"
          cat health.json; echo
          test "$code" = 200
          jq -e \
            --arg version "$(node -p "require('./package.json').version")" \
            --arg commit "${GITHUB_SHA::7}" \
            '.status == "ok" and .version == $version and .commit == $commit' \
            health.json

      - name: Logs de l'API
        if: always()
        run: cat api.log
