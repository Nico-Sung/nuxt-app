name: Setup
description: Node 24 + node_modules restauré depuis le cache créé par le job Install

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Restaurer node_modules
      uses: actions/cache/restore@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
        fail-on-cache-miss: true
